[package]
name = "hrdr-ui"
description = "hrdr web UI — Dioxus WASM SPA for the hrdr web server."
version = "0.7.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/hrdr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hrdr-ui-wasm"
path = "src/main.rs"

[dependencies]
hrdr-protocol = { path = "../hrdr-protocol" }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
gloo = { version = "0.11", features = ["dialogs"] }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Location", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

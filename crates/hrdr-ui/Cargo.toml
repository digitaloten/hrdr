# Standalone by design: excluded from the root workspace (wasm-only, built by
# dioxus-cli against its own committed Cargo.lock). The empty [workspace] table
# stops cargo from walking up to a parent workspace — without it, building this
# crate from a nested checkout (e.g. an agent worktree under .claude/worktrees/)
# resolves to the OUTER repo's workspace, which doesn't exclude that path, and
# fails with "current package believes it's in a workspace when it's not".
[workspace]

[package]
name = "hrdr-ui"
description = "hrdr web UI — Dioxus WASM SPA for the hrdr web server."
version = "0.8.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/hrdr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hrdr-ui-wasm"
path = "src/main.rs"

[dependencies]
hrdr-protocol = { path = "../hrdr-protocol" }
dioxus = { version = "0.7", features = ["web"] }
serde_json = "1"
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["sync", "rt"] }
gloo = { version = "0.11", features = ["dialogs", "timers"] }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Location", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# dx's bundled wasm-opt aborts (SIGABRT, "compile unit size was incorrect")
# on the DWARF debuginfo rustc leaves in release wasm; stripping it lets the
# optimize pass actually run instead of silently shipping unoptimized wasm.
[profile.release]
strip = "debuginfo"

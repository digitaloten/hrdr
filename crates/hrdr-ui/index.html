<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hrdr web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100dvh; display: flex; flex-direction: column; }
        #main { flex: 1; overflow-y: auto; padding: 1rem; }
        #input-bar { display: flex; padding: 0.5rem; background: #16213e; border-top: 1px solid #0f3460; }
        #input-bar input { flex: 1; padding: 0.5rem; background: #0f3460; color: #e0e0e0; border: none; border-radius: 4px; font-family: monospace; }
        #input-bar button { padding: 0.5rem 1rem; margin-left: 0.5rem; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .entry { margin-bottom: 0.5rem; padding: 0.25rem 0; }
        .entry-user { color: #e94560; }
        .entry-assistant { color: #e0e0e0; }
        .entry-tool { color: #f0a500; font-family: monospace; }
        .entry-system { color: #888; font-style: italic; }
        .entry-diff { font-family: monospace; }
        .diff-add { color: #4ecca3; }
        .diff-remove { color: #e94560; }
        .diff-hunk { color: #f0a500; }
        .entry-heading { font-size: 1.5rem; color: #e94560; text-align: center; margin: 2rem 0; }
        .entry-reasoning { color: #666; font-style: italic; border-left: 2px solid #666; padding-left: 0.5rem; }
    </style>
</head>
<body>
    <div id="main"></div>
    <div id="input-bar">
        <input id="input" type="text" placeholder="Type a message or /command…" autofocus>
        <button id="send">Send</button>
    </div>
    <script type="module">
        import init from './assets/dioxus/hrdr-ui.js';
        init('./assets/dioxus/hrdr-ui_bg.wasm');
    </script>
</body>
</html>

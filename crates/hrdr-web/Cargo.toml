[package]
name = "hrdr-web"
description = "hrdr web server — headless session host with HTTP+WS transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
ui = ["rust-embed"]

[dependencies]
hrdr-protocol.workspace = true
hrdr-app.workspace = true
hrdr-agent.workspace = true
hrdr-tools.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
axum.workspace = true
axum-server.workspace = true
rust-embed = { workspace = true, optional = true }
rusqlite.workspace = true
argon2.workspace = true
subtle.workspace = true
hmac.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
chrono.workspace = true
toml.workspace = true

[dev-dependencies]
# Sandboxes $HOME + XDG roots before ANY test in this crate runs (ctor, no opt-in).
hrdr-test-support.workspace = true
tempfile.workspace = true
